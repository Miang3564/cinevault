<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .brand {
            font-size: 26px;
            font-weight: 900;
            color: #e50914;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .player-container {
            width: 100%;
            max-width: 1100px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #222;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            background: #000;
        }
        .controls {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border-top: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 15px;
        }
        .server-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .server-group span { color: #b3b3b3; font-size: 14px; font-weight: 600; }
        .server-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }
        .server-btn.active, .server-btn:hover {
            background: #e50914;
            color: #fff;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div class="brand">CineVault</div>

    <div class="player-container">
        <iframe id="moviePlayer" src="https://vidsrc.cc/v2/embed/movie/{{ movie_id }}" allowfullscreen></iframe>
        
        <div class="controls">
            <div class="server-group">
                <span>Select Server:</span>
                <button class="server-btn active" onclick="switchServer('https://vidsrc.cc/v2/embed/movie/{{ movie_id }}', this)">Server 1</button>
                <button class="server-btn" onclick="switchServer('https://www.2embed.cc/embed/{{ movie_id }}', this)">Server 2</button>
                <button class="server-btn" onclick="switchServer('https://multiembed.mov/?video_id={{ movie_id }}&tmdb=1', this)">Server 3 (Multi-Audio)</button>
            </div>
            
            <a href="javascript:history.back()" class="back-btn">Back to Results</a>
        </div>
    </div>

    <script>
        function switchServer(url, btn) {
            document.getElementById('moviePlayer').src = url;
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
